name: Public docs guard

# This repo is public and its Pages site is world-readable. The docs here are written
# from scratch rather than copied out of the private platform repo — this job is what
# keeps that true when someone (or something) pastes in a hostname later.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/check-public-docs.sh"
      - ".github/workflows/public-docs-guard.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/check-public-docs.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: No private-estate detail in published docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check published docs for leaks
        run: ./scripts/check-public-docs.sh

      # A guard that has never failed has never been shown to work. This proves the
      # patterns actually match, without ever committing a real leak to the repo.
      - name: Prove the guard fails on a planted leak
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/docs"
          cat > "$tmp/docs/planted.md" <<'LEAK'
          host somehost.tail0d1f2e.ts.net at 192.168.1.241
          key lives in infra/.credentials/cosign.key
          LEAK
          if ./scripts/check-public-docs.sh "$tmp/docs" >/dev/null 2>&1; then
            echo "::error::The guard PASSED a file containing a tailnet name, a LAN address and a credential path. It is not actually checking anything."
            exit 1
          fi
          echo "Guard correctly rejected the planted leak."
