name: Public docs guard

# This repo is public and its Pages site is world-readable. The docs here are written
# from scratch rather than copied out of the private platform repo — this job is what
# keeps that true when someone (or something) pastes in a hostname later.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "README.md"
      - "scripts/**"
      - ".github/workflows/public-docs-guard.yml"
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - "README.md"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: No private-estate detail in published docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check published docs for leaks
        run: ./scripts/check-public-docs.sh

      # A guard that has never failed has never been shown to work: plant each kind of
      # fault in a scratch copy and require a refusal. No real leak is ever committed.
      - name: Prove the guard fails on planted faults
        run: ./scripts/test-guard.sh
