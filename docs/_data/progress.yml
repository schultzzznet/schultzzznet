    title: "What the proof unlocks"
    group: "upgrade"
    state: "partly"
    note: "One Kubernetes upgrade ran live on 2026-11-18, ahead of this order, at the owner's go. Owed: a security benchmark, a second backup copy, patching, a load test."
now: "The power-off drills started again on 2026-11-25, after the cluster DNS fix. The first passed with nothing failed. The second passed in part, twice. In the morning, pod creates were refused for 32 s and a false critical alert, from a bug in the database operator, ended the session. That evening, after the operator's update, a changed alert and admission on three replicas, nothing failed and no row was lost, but one lookup of an outside name on another node took over 1 s, which misses the run sheet's line. Found on the way: packet loss between two laptop nodes, which stopped when their Ethernet power saving was switched off, and first connections to the database poolers that take about 1 s, cause unknown. The third drill waits for the known gap of its rehearsal to be closed, or for a decision on its targets."
