drills:
  - kind: "Software failure drills"
    short: "software"
    where: "live"
    dates: "2026-11-16 and 17"
    run: 17
    passed: 15
    what: "A pod, a database primary or standby, the pooler, the ingress, cluster DNS or admission killed, or a node drained, each under a probe of what it serves (writes for the database drills). No acknowledged write was lost."
  - kind: "Power-off drills"
    short: "power-off"
    where: "live"
    dates: "2026-11-19 and 25"
    run: 5
    passed: 2
    what: "A machine switched off without warning, the owner at the machines. On 2026-11-19 the second drill found cluster DNS stalling for about 51 s. After the fix the series started again on 2026-11-25: the first drill passed, and the second passed in part on two runs. No acknowledged write was lost."
  - kind: "Restore drills"
    short: "restore"
    where: "live"
    dates: "2026-11-10 and 2026-11-15"
    run: 2
    passed: 2
    what: "A database restored from its backup store alone into a scratch cluster. Megabytes, not a full-size restore. Not counted here, because it ran off the cluster: a restore by hand on 2026-11-24 from the same store and its copy passed in part. The newest backup restored in full; an older one stopped early at a log file the store listed but could not serve, since put back."
  - kind: "Power-off rehearsals"
    short: "rehearsals"
    where: "simulated"
    dates: "2026-11-20 and 25"
    run: 5
    passed: 3
    what: "The same power-offs on a simulated cluster shaped like home. From 2026-11-20, each live drill is rehearsed there first. On 2026-11-25 two changes the live drills asked for were rehearsed with node cuts: three admission replicas passed, and the database operator's update passed in part (writes stopped for about 16 s at each switchover, against a 10 s target)."
