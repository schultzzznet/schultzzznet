# Where the work on the new platform stands, for the Progress page (docs/progress.md) and its picture
# (docs/assets/diagrams/progress.png). Copied by hand on the as_of day from the private platform repository's generated
# status page, its plan and its run records; every figure is a count on that day, never a target.
# Written in the shape scripts/build-progress.py reads: quoted strings, whole numbers, two levels at most.
# After a change: python3 scripts/build-progress.py && make -C docs/assets/diagrams progress.png
# The guard fails when the sums do not add up, when the picture was drawn from other data, when this file is older than
# 21 days, or when a newer docs/_data/stats.yml disagrees with a figure both files hold.
