# The landing page's "Recently": what changed in the estate, newest first. Rendered by docs/index.md.
# Each entry is a date and one or two sentences (markdown allowed); the full account lives on the page it links to.
# scripts/check-summaries.py fails the build if the newest entry is more than 45 days old, so this list cannot quietly
# stop being a list of recent things. Nothing here may name a machine, an address, or an exact software version.
- date: 2026-11-11
  text: "A new section on [How we work](how-we-work.html#two-axes-what-you-write-and-who-applies-it) names the two independent axes behind V2.0 on top of V1.0: what you write (declarative or scripted) and who applies it (pull or push). V1.0 measured mostly scripted and push; V2.0 is declarative and pull in the cluster and still scripted and push at the edges, so it is not fully GitOps yet. The first four delivery rows of the [diff list](versions.html) name their cell. To stay within the twelve-entry cap, the oldest entry (the 2026-10-27 printing parts-list note) was dropped on purpose."
- date: 2026-11-11
  text: "A diff list between the retired cluster and the new one was added: [V1.0 and V2.0, what changed](versions.html). The old platform is now kept as V1.0, a diffed reference with every fact still dated, and the new site is V2.0. The list also says where V1.0 did better and what is not rebuilt yet."
- date: 2026-11-11
  text: "Both home CI builder hosts started jobs in parallel for the first time, one job virtual machine at a time on each. The gates were still running when this was written, so this records that they started, not that they passed."
- date: 2026-11-11
  text: "The new cluster's monitoring was merged on 2026-11-11. Its first live run failed on a missing namespace in the node exporter manifests; the fix landed the same day, and at 07:00 UTC all 19 Kustomizations were Ready and the monitoring pods were Running. Nothing from it has been read yet, so no alert reaches a person. [Status](status.html)."
- date: 2026-11-11
  text: "This site now describes the new platform. Figures that cannot be measured yet say \"not measured yet\" instead of keeping an old number, V1.0's facts sit in dated notes, and a new page, [How we work](how-we-work.html), covers the ways of working and the failures that shaped them. Public claims changed in this edit; the status page shows what is measured and what is not."
- date: 2026-11-10
  text: "V1.0 was taken down in stages after a base backup of every database and a recorded baseline: pause, drain, storage down, uninstall, no failed task. The stock uninstaller left a virtual address on one node and a password file on every node; both were removed by hand and written down. Its restore drills were waived on purpose, so its data was not proven restorable at the end."
- date: 2026-11-10
  text: "A new cluster was built on the same six machines, by playbook, in order, with a person watching: about four and a half hours from the first merge to a converged site. The first live run found five faults, three in the cluster layer and two in the host layer, each fixed in git. Monitoring, alerts to a person, a public name and replicated storage are not there yet. [Status](status.html)."
- date: 2026-11-10
  text: "A restore drill passed on the new cluster: a scratch database came back from the object store alone with a marker row and all six tables in about a minute, on a database of a few megabytes. It was blocked three times first by the platform's own quota, network rules and reconciler. It does not prove real-size time, a scheduled-backup restore, or a copy off the one backup machine. [How we work](how-we-work.html)."
- date: 2026-11-10
  text: "The default-deny network probe on the new cluster is recorded as a fail. After about 30 seconds every blocked path is blocked, but a new pod is open for roughly one to three seconds after it starts. Whether another network engine or a start-up wait closes the gap is untested. [Status](status.html)."
- date: 2026-11-10
  text: "The host layer was rehearsed on three blank local virtual machines: ready in 4 minutes 11 seconds from creation, and a second full run changed nothing. It found four defects on the way. It is one distribution, no node failure and no three-member quorum test, so it shows flow and idempotence, not the real topology. [How we work](how-we-work.html)."
- date: 2026-10-30
  text: "Alerting and monitoring is now written down as one loop: alerts straight to chat, an hourly post composed by code, a morning digest, and a daily second reader that is a cloud model, with a person approving every action and grading a monthly sample. It also corrects two statements: a cloud model now sees a day's alert text, and the local model no longer writes the hourly post. [The loop](aiops.html#the-loop-two-models-one-human)."
- date: 2026-10-27
  text: "The embedded side's nightly vulnerability upload, refused every night since at least 24 September, was fixed: a new key, and a preflight that now stops the build up front if the tracker rejects it. The first scheduled run since is the test. [The account](yocto.html#two-claims-on-this-page-were-false-on-27-october)."
