# The landing page's "Recently": what changed in the estate, newest first. Rendered by docs/index.md.
# Each entry is a date and one or two sentences (markdown allowed); the full account lives on the page it links to.
# scripts/check-summaries.py fails the build if the newest entry is more than 45 days old, so this list cannot quietly
# stop being a list of recent things. Nothing here may name a machine, an address, or an exact software version.
- date: 2026-11-26
  text: "A new lesson, [the same fault twice](lessons.html#17-the-same-fault-twice-three-months-apart): network power saving (Energy-Efficient Ethernet) dropped a wired link on the workstation in August, and in November two laptop nodes of the new cluster lost packets on a quiet link. The first lesson was carried only as a sentence, not as a check, so it was found late the second time. With power saving off on both nodes, 0 of 72,000 pings were lost; that it was the cause this time is not proven. To stay within the twelve-entry cap, the oldest entry (2026-11-11: this site moved to describing the new platform) was dropped."
- date: 2026-11-22
  text: "A new page, [Progress](progress.html), shows where the work on the new platform stands in one picture, drawn by a script from a data file: build, then break, then upgrade, in six phases, with the power-off drills (phase 4) as now. Counts on 2026-11-22: 2 of 12 build-order steps done, 3 of 110 objective rules built, 18 of 21 drills on the home site passed, 82 of 109 run records pass, no single point proven fixed. To stay within the twelve-entry cap, the oldest entry (2026-11-10: V1.0 taken down in stages) was dropped; it is still on [How we work](how-we-work.html)."
- date: 2026-11-20
  text: "Cluster DNS on every node went live in two of its five steps on 2026-11-20; the old add-on keeps running until the later steps, and those are held: in the first soak one node failed two of about 7,600 lookups, both fast, the cause is not known, and a log line for each failed lookup goes in, with a clean soak, before the change-over goes on. The same day a rule was set: every failure scenario is rehearsed first in a simulated cluster shaped like home (three servers, three agents) and only then run live ([How we work](how-we-work.html), [Reliability](reliability.html)). Later the same day, after a soak with no failed lookup, the other three steps ran: the old add-on is gone, and the probe saw no failed lookup after the first step. Three power-off rehearsals also ran on the simulated cluster that day; two passed ([Progress](progress.html)). To stay within the twelve-entry cap, the four oldest entries (2026-11-10: the bring-up, the first restore drill, the failed default-deny probe and the host rehearsal) were dropped; they are still on [Status](status.html) and [How we work](how-we-work.html)."
- date: 2026-11-19
  text: "The first power-off drills ran, with the owner at the machines. The first, a plain worker, passed: nothing failed, the node-loss alerts reached the chat channel about six and a half minutes after it went dark, and it was whole 2.6 minutes after power-on. The second, a worker holding one of the two cluster DNS replicas, failed: until the node was marked down, lookups on the other nodes stalled for about 51 seconds and two of the probe's test writes failed (every user request was answered), so the series stopped and starts again from the first drill once the fix, cluster DNS on every node, is in. [Reliability](reliability.html)."
- date: 2026-11-17
  text: "Eight more software failure drills: with the pooler fix in, the same primary kill came back in 27.9 seconds against 30, a pass with a thin margin, and three node drains, the login database's primary, and the primary killed together with the database operator or with one backup-plugin pod all passed. One missed: with both backup-plugin pods down the failover started late and writes came back after about 35 seconds, with no acknowledged write lost; it is open. Over the two days, 17 drills, 15 passed. [Reliability](reliability.html)."
- date: 2026-11-16
  text: "The first nine software failure drills ran on the live cluster, each under a write probe: the app's pods, the ingress, the connection pooler, cluster DNS, admission, the login service, the app database's standby and primary, and a switchover of the login database. Eight passed; killing the app database's primary left writes down for 48.6 seconds against a 30-second target, because the connection pooler held on to a failed login after the failover, a design flaw no review had found. No acknowledged write was lost. [Reliability](reliability.html)."
- date: 2026-11-12
  text: "A new page, [Applications of the platform](applications.html), lists the workloads the platform is meant to carry (embedded Linux, the mower, the rover, 3D printing, the reference apps and the killer app) with a dated proven, built, planned or open row for each claim and what the platform still lacks for it. One application is proven on the new platform; the killer app does not exist."
- date: 2026-11-11
  text: "A new page, [History](history.html), shows the line from V1.0 to V2.0: V1.0 ran from 2025-12-21 to 2026-11-10, with 2,051 commits, 226 merged pull requests and a commit in every calendar month from December 2025 to November 2026, measured by a committed script and frozen. It lists dated milestones and receipts anyone can check: commits to this public repository, with the push times GitHub recorded, that published V1.0's figures before V2.0 existed. The cluster is a day old; the platform is not. To stay within the twelve-entry cap, the 2026-10-27 note on the embedded side's vulnerability upload was dropped; it is still on [the embedded page](yocto.html#two-claims-on-this-page-were-false-on-27-october)."
- date: 2026-11-11
  text: "A new section on [How we work](how-we-work.html#two-axes-what-you-write-and-who-applies-it) names the two independent axes behind V2.0 on top of V1.0: what you write (declarative or scripted) and who applies it (pull or push). V1.0 measured mostly scripted and push; V2.0 is declarative and pull in the cluster and still scripted and push at the edges, so it is not fully GitOps yet. The first four delivery rows of the [diff list](versions.html) name their cell. To stay within the twelve-entry cap, the oldest entry (the 2026-10-27 printing parts-list note) was dropped on purpose."
- date: 2026-11-11
  text: "A diff list between the retired cluster and the new one was added: [V1.0 and V2.0, what changed](versions.html). The old platform is now kept as V1.0, a diffed reference with every fact still dated, and the new site is V2.0. The list also says where V1.0 did better and what is not rebuilt yet."
- date: 2026-11-11
  text: "Both home CI builder hosts started jobs in parallel for the first time, one job virtual machine at a time on each. The gates were still running when this was written, so this records that they started, not that they passed."
- date: 2026-11-11
  text: "The new cluster's monitoring was merged on 2026-11-11. Its first live run failed on a missing namespace in the node exporter manifests; the fix landed the same day, and at 07:00 UTC all 19 Kustomizations were Ready and the monitoring pods were Running. Nothing from it has been read yet, so no alert reaches a person. [Status](status.html)."
