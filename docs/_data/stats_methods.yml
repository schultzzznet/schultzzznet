# How each figure in stats.yml is measured, shown beside it on /status.html.
# Every key in stats.yml needs an entry here and every entry needs a key: the leak
# guard and scripts/gather-stats.py both fail on a mismatch, so a figure never ships
# without saying where it came from. Commands are generic - no paths, no names.
#   label  what the figure is called on the page
#   unit   appended to the value (optional)
#   how    one line: the command, and what exactly is counted
cluster:
  nodes: { label: "Nodes", how: "kubectl get nodes; the number of node objects." }
  nodes_ready: { label: "Nodes Ready", how: "kubectl get nodes; nodes whose Ready condition is True." }
  control_plane: { label: "Control-plane nodes", how: "kubectl get nodes; nodes carrying the control-plane role label (each also runs etcd)." }
  agents: { label: "Agent nodes", how: "kubectl get nodes; nodes without the control-plane role label." }
  cores: { label: "CPU cores", how: "kubectl get nodes; the sum of each node's reported CPU capacity." }
  ram_gb: { label: "Memory", unit: " GB", how: "kubectl get nodes; the sum of memory capacity in bytes, divided by 10^9. Decimal gigabytes, not GiB." }
  pods_running: { label: "Pods running", how: "kubectl get pods across all namespaces; pods in phase Running." }
  pods_total: { label: "Pods, all phases", how: "kubectl get pods across all namespaces; every pod object, including completed job pods." }
  namespaces: { label: "Namespaces", how: "kubectl get namespaces; every namespace object, empty and system ones included." }
  containers: { label: "Containers in running pods", how: "kubectl get pods; the sum of containers declared by pods in phase Running (init containers not counted)." }
  deployments: { label: "Deployments", how: "kubectl get deployments across all namespaces." }
  statefulsets: { label: "StatefulSets", how: "kubectl get statefulsets across all namespaces." }
  daemonsets: { label: "DaemonSets", how: "kubectl get daemonsets across all namespaces." }
  cronjobs: { label: "CronJobs", how: "kubectl get cronjobs across all namespaces; suspended ones included." }
  hpas: { label: "Horizontal autoscalers", how: "kubectl get horizontalpodautoscalers across all namespaces." }
  ingresses: { label: "Ingresses", how: "kubectl get ingresses across all namespaces." }
  pvcs: { label: "Persistent volume claims", how: "kubectl get persistentvolumeclaims across all namespaces." }
  pvc_gib: { label: "Storage requested by claims", unit: " GiB", how: "kubectl get persistentvolumeclaims; the sum of requested size. Requested, not used." }
  crds: { label: "Custom resource definitions", how: "kubectl get customresourcedefinitions." }
  age_days: { label: "Age of the oldest node", unit: " days", how: "kubectl get nodes; whole days since the oldest node object was created. V1.0 ran until 2026-11-10 and this cluster was built on 2026-11-10/11, so this is not the age of the project." }
  restarts_total: { label: "Container restarts", how: "kubectl get pods; the sum of restart counts over all containers and init containers that currently exist." }
storage:
  storage_classes: { label: "Storage classes", how: "kubectl get storageclasses; every storage class object. All are node-local: a volume lives on one machine and does not follow a pod to another." }
  default_storage_classes: { label: "Default storage classes", how: "Same objects; those marked as the default." }
  pvcs_bound: { label: "Claims bound", how: "kubectl get persistentvolumeclaims across all namespaces; claims whose phase is Bound." }
reconciler:
  kustomizations: { label: "Flux Kustomizations", how: "kubectl get kustomizations of the GitOps controller, all namespaces; every object. Each one is a folder of the repository that the controller applies and keeps applied." }
  kustomizations_ready: { label: "Kustomizations Ready", how: "Same objects; Ready condition True at the moment of measurement. A point-in-time reading, not a history: on 2026-11-11 the unready ones were the monitoring rollout and one Kustomization still reconciling, and the count changed within minutes." }
  kustomizations_suspended: { label: "Kustomizations suspended", how: "Same objects; those with the suspend flag set." }
  kustomizations_prune_on: { label: "Kustomizations with prune on", how: "Same objects; those with prune enabled, so an object removed from the repository is removed from the cluster." }
  sources_ready: { label: "Sources Ready", how: "kubectl get the controller source objects (git, OCI, Helm, bucket); those with Ready True." }
  revisions_in_use: { label: "Revisions in use", how: "Same Kustomizations; distinct last-applied revisions. 1 means everything runs the same published artifact." }
  artifact_age_hours: { label: "Age of the oldest source artifact", unit: " hours", how: "Source objects; whole hours since the build time recorded in the artifact metadata (its stored time if that is missing). The oldest artifact in use is reported, so a stale one cannot hide behind a fresh one." }
  artifact_signed: { label: "Source artifact signed", how: "Not measured, and the honest answer today is no: the published artifact is not signed and the controller is not set to verify one, so there is nothing to read. This line stays until a signing and verification setting exists; then it is replaced by a count." }
admission:
  policies: { label: "Admission policies", how: "kubectl get the admission controller's validating, image-validating and mutating policy objects (the current policy kinds); every object. The older cluster-policy kind is not used and not counted." }
  policies_ready: { label: "Policies Ready", how: "Same objects; those whose status reports ready. Ready means the policy was accepted, not that it has been tested." }
  policies_deny: { label: "Policies that deny", how: "Same objects; those whose validation actions include Deny, so a violation is refused rather than only reported." }
  namespaces_signature_enforced: { label: "Namespaces with the signature check enforced", how: "kubectl get namespaces; those carrying the signature-check label set to enforce, which is what the image policy selects on." }
  namespaces_podsecurity_restricted: { label: "Namespaces enforcing the restricted pod standard", how: "kubectl get namespaces; those whose pod-security enforce label is restricted. The others enforce a weaker level or none." }
  network_policies: { label: "Network policies", how: "kubectl get networkpolicies across all namespaces; every object." }
  tenant_namespaces: { label: "Tenant namespaces", how: "kubectl get namespaces; those carrying the signature-check label, which every tenant namespace gets from the shared template." }
  tenants_default_deny: { label: "Tenants with a default-deny network policy", how: "Network policies in tenant namespaces that select every pod, cover ingress and egress and allow nothing. A structural count, not a behavioural one: a probe on 2026-11-10 failed, because for about one to three seconds after a pod starts the rules are not yet in force." }
  quotas: { label: "Resource quotas", how: "kubectl get resourcequotas across all namespaces; every object." }
  quota_max_used_pct: { label: "Highest quota use", unit: "%", how: "Same objects; the largest used-over-hard ratio of any single resource, as a whole percent. A reading at one moment: it moves as pods start and stop." }
  first_party_signed_verified: { label: "First-party images whose signature verifies", how: "Not measured: verifying a signature needs a registry credential, which the generator must not hold. The check runs inside the admission policy instead, where an unsigned image is refused (shown on a throwaway cluster). This line stays until a verification that needs no credential exists." }
databases:
  clusters: { label: "Postgres clusters", how: "kubectl get clusters of the Postgres operator; every cluster object." }
  instances: { label: "Postgres instances", how: "Same objects; the sum of reported instances (primaries and replicas)." }
  instances_ready: { label: "Instances ready", how: "Same objects; the sum of instances the operator reports ready." }
  replicas: { label: "Replicas", how: "Same objects; instances minus one primary per cluster." }
  postgres_major: { label: "PostgreSQL major version", how: "Same objects; the major version of the database image each cluster reports (the lowest, if clusters differ)." }
  synchronous_clusters_spec: { label: "Clusters configured for synchronous commit", how: "Same objects; a synchronous setting or a minimum of synchronous replicas in the spec. What was asked for, not read back from a primary: no query is run against the database." }
  clusters_spread_over_nodes: { label: "Clusters with instances on distinct machines", how: "kubectl get pods of the database instances; clusters with more than one instance whose instances all sit on different nodes. A placement at this moment." }
  poolers: { label: "Connection poolers", how: "kubectl get poolers of the Postgres operator; every pooler object." }
  scheduled_backups: { label: "Scheduled backups", how: "kubectl get scheduledbackups of the Postgres operator; every object." }
  backups_total: { label: "Backup objects", how: "kubectl get backups of the Postgres operator; objects that still exist. A backup that failed and was cleaned away is not counted, and the operator prunes old ones." }
  backups_failed: { label: "Failed backups", how: "Same objects; phase failed, among those that still exist." }
  backups_24h: { label: "Backups completed in the last 24 hours", how: "Same objects; phase completed with a stop time within 24 hours of the measurement. Backup objects are counted because the operator's plugin leaves the cluster's lastSuccessfulBackup field empty, so backup objects are the record." }
  archiving_clusters: { label: "Clusters archiving WAL", how: "kubectl get clusters of the Postgres operator; ContinuousArchiving condition True." }
evidence:
  restore_drill_home_last: { label: "Latest restore drill on the home site", how: "The newest run record naming a restore drill whose Where line says home site, by its Date line. Records of V1.0 are excluded." }
  restore_drill_home_result: { label: "Result of that restore drill", how: "The Result line of the same record: pass or fail. One on-demand backup restored into a scratch cluster; it does not prove a restore of the scheduled nightly backup." }
  restore_drill_home_age_days: { label: "Days since that restore drill", unit: " days", how: "Whole days between that record's date and the measurement." }
  restore_drills_records: { label: "Restore-drill records, all platforms", how: "Run records whose file name mentions a restore, V1.0 and kind rehearsals included." }
  default_deny_probe_home_date: { label: "Latest default-deny probe on the home site", how: "The newest run record of the default-deny probe whose Where line says home site, by its Date line." }
  default_deny_probe_home_result: { label: "Result of that probe", how: "The Result line of the same record. It is fail: pods have about one to three seconds of open network after start. The record is kept, not edited." }
  host_rehearsal_date: { label: "Latest host-layer rehearsal", how: "The newest run record of the rehearsal of the host layer on local virtual machines, by its Date line." }
  host_rehearsal_result: { label: "Result of that rehearsal", how: "The Result line of the same record. Three blank virtual machines to a healthy cluster, once, on one distribution; not the real machines." }
  steps_total: { label: "Steps in the plan", how: "Parsed from the private repository's generated status page, read from its main branch and cross-checked against that page's own table; the generator fails if the shape changes. Every step in the order of work. The steps, rules and inventory figures are as of the private status page of 2026-11-10 and inherit its staleness." }
  steps_done: { label: "Steps done", how: "Same page; steps in state done." }
  steps_done_on_kind: { label: "Steps done on a throwaway cluster only", how: "Same page; steps in state done on kind, which means proven on a disposable cluster and not yet on the home site." }
  steps_partly: { label: "Steps partly done", how: "Same page; steps in state partly." }
  steps_not_started: { label: "Steps not started", how: "Same page; steps in state not started." }
  steps_gated: { label: "Steps gated", how: "Same page; steps waiting for an owner decision." }
  rules_total: { label: "Rules in the objectives", how: "Same page; every rule on the objective pages." }
  rules_built: { label: "Rules built", how: "Same page; rules marked built. Built means a check enforces the rule, not that it has run for long." }
  rules_partly: { label: "Rules partly built", how: "Same page; rules marked partly built." }
  inventory_total: { label: "Components in the inventory", how: "Same page; every component in the inventory." }
  inventory_proven: { label: "Components proven on the new platform", how: "Same page; components whose state is proven." }
  single_points_accepted: { label: "Single points accepted by the owner", how: "Parsed from the Single points line of the private repository's generated status page, which counts the decision lines of its single-points register. Shared-path and supporting points only: a point on an app's own path is never accepted." }
  single_points_fixed: { label: "Single points fixed", how: "Same line; rows whose decision is fixed, which needs a record that powered off the node that held the first one." }
  single_points_open: { label: "Single points open", how: "Same line; rows whose decision is open." }
  single_points_open_app: { label: "Open single points on an app's own path", how: "Same line; open rows whose scope is app (the app, its login, its database, what its writes and failover depend on). The rule says these are never accepted." }
  single_points_open_shared: { label: "Open single points on the shared path", how: "Same line; open rows whose scope is shared-path (cluster DNS, ingress, admission)." }
  inventory_built: { label: "Components built, not proven", how: "Same page; components whose state is built." }
observability:
  scrape_targets: { label: "Scrape targets", how: "Active targets the metrics store is scraping that report up, read from its own targets list (a target that is down or not yet scraped is not counted)." }
  alert_rules: { label: "Alert rules", how: "Alerting rules loaded in the metrics store, counted from its rules list." }
  recording_rules: { label: "Recording rules", how: "Recording rules loaded in the metrics store, counted from its rules list; 0 means none are loaded." }
  dashboards: { label: "Dashboards", how: "JSON dashboard files committed to git under the dashboard service's own manifest directory; dashboards kept elsewhere in git (for example inside a ConfigMap) or made by hand in the service are not counted, and the service is never logged in to. 0 means no such file exists today." }
  metric_history_days: { label: "Metric history held", how: "Days between the oldest sample the metrics store actually holds and now, to two decimals (0.04 is about an hour): history held, not the configured retention." }
  alerts_reaching_a_person: { label: "Alerts that reach a person", how: "Not measured: alerts go to a chat channel, which pages nobody. The generator fails if the alert router gains a paging, phone or e-mail receiver, so this line cannot outlive the gap." }
  sbom_projects: { label: "SBOMs accepted by a tracker", how: "Not measured: no software-bill-of-materials upload job exists. The generator fails if one appears, so this line cannot outlive the gap." }
ci:
  workflows: { label: "Workflow files", how: "Listing the workflow directory of the platform repository's main branch, read from a fresh clone." }
  jobs: { label: "Workflow jobs", how: "Parsing each workflow file; entries under its jobs key." }
  runs_on_self_hosted: { label: "Jobs that name a self-hosted runner", how: "Parsing the runs-on line of each job; those naming self-hosted." }
  runs_on_github_hosted: { label: "Jobs on GitHub-hosted runners", how: "Parsing the runs-on line of each job; those naming an ubuntu, macos or windows image." }
  runs_on_routed: { label: "Jobs whose runner is chosen at run time", how: "Parsing the runs-on line of each job; those set by an expression, so a routing step decides between the home runners and hosted ones per run. Jobs that call a reusable workflow declare no runner of their own and are in none of the runner rows." }
  precommit_hooks: { label: "Pre-commit hooks", how: "Counting hook ids in the pre-commit configuration of the platform repository." }
repo:
  commits: { label: "Commits", how: "git rev-list --count on the platform repository's main branch, read from a fresh clone, not from a local branch." }
  commits_30d: { label: "Commits in the last 30 days", how: "The same, since 30 days before the measurement." }
  age_days: { label: "Repository age", unit: " days", how: "Whole days since the earliest root commit. The repository is new: V1.0, which ran until 2026-11-10, lived in another one." }
  adrs: { label: "Decision records", how: "Committed files; numbered Markdown files in the decision-record directory." }
  records: { label: "Run records", how: "Committed files; dated Markdown files in the records directory, each the result of one gate run." }
  records_pass: { label: "Run records with result pass", how: "Same files; the Result line starts with pass." }
  records_fail: { label: "Run records with result fail", how: "Same files; the Result line starts with fail. A failure is kept when it taught something." }
  check_scripts: { label: "Check scripts", how: "Committed files; scripts in the scripts directory whose name starts with check-." }
  playbooks: { label: "Ansible playbooks", how: "Committed files; top-level YAML files in the host playbook directory." }
  manifests: { label: "Kubernetes manifest files", how: "Committed files; YAML files under the platform, site and app folders that declare a kind." }
  runbooks: { label: "Runbooks", how: "Committed files; Markdown files in the runbooks directory, the index excluded." }
  docs_pages: { label: "Documentation pages", how: "Committed files; Markdown files under the docs directory." }
  loc: { label: "Lines of code, docs and config included", how: "cloc on the main branch; code lines of the committed tree, excluding comments and blanks. Markdown, YAML, JSON and XML are counted as code by cloc, so this is not programming effort." }
  loc_code: { label: "Lines of code, programming languages only", how: "The same cloc run, summing only programming languages (Java, Python, Go, C and C++, shell, SQL, JavaScript and similar). Configuration and prose are left out." }
  tests_java: { label: "Java test methods", how: "Static count of @Test, @ParameterizedTest and @RepeatedTest annotations in committed test sources. Counted, not run." }
  app_warn_version: { label: "Warn app version", how: "The project-level version in the app's committed Maven file, after the parent block, which carries the framework version instead. The version the repository declares, not a store release." }
hardware:
  printing_commits: { label: "3D printing repository, commits", how: "git rev-list --count HEAD in the printing repository." }
  yocto_commits: { label: "Embedded Linux (Raspberry Pi) repository, commits", how: "git rev-list --count HEAD in the Yocto repository." }
  rover_platform_commits: { label: "Rover platform repository, commits", how: "git rev-list --count HEAD in the rover platform repository." }
  rover_platform_tests: { label: "Rover platform tests", how: "Static count of Python test_ functions and Go Test functions in committed test files. Counted, not run. C assertions are a separate row." }
  rover_platform_c_assertions: { label: "Rover platform C assertions", how: "Static count of CHECK( assertions in committed C test files. An assertion is not a test: one test function holds several. Counted, not run." }
  mower_commits: { label: "Mower repository, commits", how: "git rev-list --count HEAD in the mower repository." }
  mower_tests: { label: "Mower tests", how: "Static count of Python test_ functions in committed test files. Counted, not run." }
  video_rover_commits: { label: "Video rover repository, commits", how: "git rev-list --count HEAD in the video rover repository." }
  video_rover_tests: { label: "Video rover tests", how: "Static count of Go Test functions in committed test files. Counted, not run." }
  imx8_commits: { label: "i.MX8 repository, commits", how: "git rev-list --count HEAD in the i.MX8 repository." }
site:
  commits: { label: "Commits to this site", how: "git rev-list --count HEAD in this repository, before the commit that carries this file." }
  pages: { label: "Pages", how: "Counting Markdown files in this site's docs directory." }
  pages_last_build: { label: "Last Pages build", how: "GitHub REST API, workflow runs; conclusion of the newest finished Pages build." }
  pages_last_build_at: { label: "Last Pages build finished", how: "The same run; its updated time." }
  guard_last_run: { label: "Last leak-guard run", how: "GitHub REST API, workflow runs; conclusion of the newest finished run of the guard workflow." }

  last_push: { label: "Last push to this repository", how: "GitHub REST API, repository endpoint; pushed_at." }
# V1.0's history, in docs/_data/history.yml, written by scripts/gather-history.py (make history) and shown on /history.html.
# It is FROZEN, not a snapshot: V1.0's repository is dormant, so `make history-check` re-measures and must find nothing
# changed. The stats freshness rule does not apply to it; scripts/gather-history.py --verify checks kinds, sums and that
# every key below has a figure and every figure a key. "Git's clock" is the committer's own clock, so its author could
# have set it; "GitHub's clock" is a server timestamp the author cannot set.
history:
  chart_days: { label: "Days drawn in the timeline", how: "V1.0's days plus one, so the last day (the teardown) has a width. Bars that are still running end at the right edge." }
  v1_first_commit: { label: "V1.0's first commit", how: "git, a fresh clone of the V1.0 repository's default branch; the committer date of its single root commit. Git's clock." }
  v1_last_commit: { label: "V1.0's last commit", how: "Same clone; the committer date of the branch head. Git's clock. A later commit there would fail make history-check." }
  v1_retired: { label: "V1.0 torn down", how: "The date in the file name of the V2.0 repository's run record of the old platform's teardown." }
  v1_days: { label: "V1.0's length", unit: " days", how: "Whole days from the first commit to the teardown. The life of the repository and the practice, not the uptime of any one cluster: no cluster ran that long." }
  v1_commits: { label: "V1.0 commits", how: "`git rev-list --count` on the same clone's head. Git's clock." }
  v1_active_days: { label: "Days with at least one V1.0 commit", how: "Distinct committer dates over the same commits, each in its own time zone. Git's clock." }
  v1_merged_prs: { label: "V1.0 pull requests merged", how: "GitHub REST API, the repository's closed pull requests; those with a merge time up to the day of the last commit (UTC). GitHub's clock. Before the pull-request gate of 2026-07-30 changes went straight to the main branch, so this starts in August." }
  v1_first_merged_pr: { label: "First merged pull request", how: "The same list; the earliest merge time, as a UTC date. GitHub's clock." }
  v1_ci_runs: { label: "V1.0 CI runs", how: "GitHub REST API, Actions runs created per day range (UTC) from the first to the last commit, every run whatever its result; a range at the search cap is halved until each part is below 1,000. GitHub's clock." }
  v1_first_ci_run: { label: "First CI run", how: "The same API; the first day from the first commit on with a run created. GitHub's clock." }
  v1_adrs: { label: "V1.0 decision records", how: "Same clone; numbered Markdown files in the decision-record directory at the head." }
  v1_last_cluster_built: { label: "Last V1.0 cluster built", how: "From this public repository: the measurement date of each generated stats file from before V2.0 minus the cluster age it published (the age of the oldest node object). They must agree within a day. Anyone can repeat it from the receipts." }
  v2_first_commit: { label: "V2.0 repository started", how: "git, a fresh clone of the V2.0 repository's default branch; the committer date of its root commit. Git's clock." }
  v2_built: { label: "V2.0 built on the machines", how: "The date in the file name of the V2.0 run record of the home site's bring-up." }
  site_first_commit: { label: "First public write-up of the platform", how: "git on this public repository's main branch; the earliest commit on or after V1.0's first commit (the three older commits are a 2021-2022 profile text). Anyone can repeat it." }
  site_commits_v1_window: { label: "Commits to this public repository during V1.0", how: "The same log; commits from V1.0's first to its last commit date. Anyone can repeat it." }
  site_first_deployment: { label: "First GitHub Pages deployment", how: "GitHub REST API, this repository's deployments; the oldest creation time. GitHub's clock, and public." }
  site_deployments_before_v2: { label: "Pages deployments before V2.0 existed", how: "The same list; deployments created before the V2.0 repository's first commit date. GitHub's clock, and public." }
  months_days: { label: "Days of V1.0 in the month", how: "Calendar days of the month inside V1.0's first and last commit dates (December 2025 starts on the 21st, November 2026 ends on the 5th)." }
  months_commits: { label: "Commits in the month", how: "As V1.0 commits, by committer month in each commit's own time zone. Git's clock." }
  months_active_days: { label: "Days with a commit in the month", how: "As days with at least one V1.0 commit, per month. Git's clock." }
  months_merged_prs: { label: "Pull requests merged in the month", how: "As V1.0 pull requests merged, by UTC month of the merge time. GitHub's clock." }
  months_ci_runs: { label: "CI runs in the month", how: "As V1.0 CI runs, for the month's days inside V1.0 (UTC). GitHub's clock." }
  months_site_commits: { label: "Commits to this public repository in the month", how: "As commits to this public repository during V1.0, per month. Anyone can repeat it." }
  eras: { label: "Timeline bars", how: "Seven bars with dates: Swarm (to 2026-06-09) and the k3s start (2026-04-04) are from my private record and already on the site; the last cluster build, the public write-up and Pages are measured from this repository; the V2.0 dates as above. from_day and to_day are days since V1.0's first commit." }
  receipts: { label: "Public receipts", how: "Every commit to this repository before V2.0 that changed the generated stats file, one per measurement time: the V1.0 figures it published, the time GitHub recorded the push that first contained it (the activity API, GitHub's clock), and V1.0's commits counted today with `git rev-list --count --before` that measurement time. The two counts differ by commits made before and pushed after a measurement." }
  milestones: { label: "Milestones", how: "Lines written by a person in scripts/gather-history.py, never copied from a private commit message. A public one names a commit in this repository, checked to be on main, with the time GitHub recorded the push that first contained it; a private one is my record, which a reader cannot check." }
