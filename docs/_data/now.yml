# The Now board: what is moving this week. Drawn on docs/now.md and, by scripts/build-now.py --write, in README.md between
# the now markers, so the site and the profile cannot disagree. Kept by hand on every change of state (a merge, an apply, a
# drill, a decision of the owner's), from the private platform repository and its open changes.
# Written in the shape scripts/build-progress.py reads: quoted strings, whole numbers, two levels at most.
# After a change: python3 scripts/build-now.py --write && make check
# The guard fails when as_of is more than 7 days old or in the future, when a done item is not from the last 14 days,
# when a headline figure disagrees with a newer progress.yml or stats.yml, or when the README block is out of step.
# Each item is one plain sentence; a link names a site page. Nothing here may name a machine, an address, an exact
# software version, a place where a secret is kept, or how a weakness could be used.
