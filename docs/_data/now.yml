    text: "The old cluster's remains were removed from all six machines by a guarded change, one machine at a time, with the two database primaries moved first; a check is green on every machine."
  - date: "2026-11-26"
    text: "A replicated block-storage layer was ruled out: the machines can never take another disk, so it would run on files on the system disk. Logs and traces will keep their data in the replicated object store instead."
