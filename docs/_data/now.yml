  - date: "2026-11-26"
    text: "A pipeline test that picked up leftovers of the test before it was fixed and passed on the home build hosts, and new tests for a network safety check were merged."
  - date: "2026-11-26"
    text: "Leftovers from the old cluster's time, a local DNS helper and stale network-share entries, were removed from both laptop nodes, and the node check is green on all six machines."
  - date: "2026-11-26"
    text: "An overnight control run on the simulated cluster measured what losing a node costs today: about half of new requests fail until the node is declared down, 40 to 70 seconds, and writes stop for 80 to 92 seconds when the database primary goes, with nothing lost."
  - date: "2026-11-26"
    text: "A new lesson was published, [the same fault twice](lessons.html#17-the-same-fault-twice-three-months-apart): network power saving dropped packets on two laptop nodes, three months after it had dropped a link on the workstation."
